name: Context proposal artifact verification
on:
  push:
    paths: ['research/context-capsules/v1/**', '.github/workflows/context-proposal.yml']
  pull_request:
    paths: ['research/context-capsules/v1/**', '.github/workflows/context-proposal.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen publication and replay source context
        run: python research/context-capsules/v1/verify.py
