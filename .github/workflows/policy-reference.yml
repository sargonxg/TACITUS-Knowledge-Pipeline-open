name: Policy reference checks
on:
  push:
    paths: ['reference-pipeline/**', '.github/workflows/policy-reference.yml']
  workflow_dispatch:
  pull_request:
    paths: ['reference-pipeline/**', '.github/workflows/policy-reference.yml']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - working-directory: reference-pipeline
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python benchmarks/run.py
          PYTHONPATH=src python -m tacitus_pipeline build --input examples/assessment/collection.json --ontology ontology/policy.json --layer layers/assessment-evidence.json --question "Map assessment evidence and review roles." --output build/assessment
          PYTHONPATH=src python -m tacitus_pipeline build --input examples/syria-negotiation/collection.json --ontology ontology/negotiation.json --layer layers/syria-negotiation.json --question "Prepare a historical negotiation-policy desk note." --output build/syria
          PYTHONPATH=src python examples/citation-guidance/compile.py --output build/citation-guidance
          cmp examples/citation-guidance/proof.json build/citation-guidance/proof.json
          diff -r examples/citation-guidance/compiled build/citation-guidance/compiled
          python -m pip install pyshacl==0.40.2 rdflib==7.6.0
          python examples/citation-guidance/verify-standards.py build/citation-guidance/compiled/standards.jsonld
